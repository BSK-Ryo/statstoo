# Site settings
title: StatsToo（スタッツー）
description: バスケットボールのスタッツ記録・分析ツール。試合から個人練習まで、バスケを楽しむ全ての人をサポートします。
url: "https://statstoo.com"
baseurl: ""

# SEO settings
image: /ogp.png
twitter:
  card: summary_large_image

# Locale
lang: ja_JP

# Author
author:
  name: StatsToo編集部
  url: https://statstoo.com/about/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Build settings
markdown: kramdown
permalink: pretty

# Sass settings
sass:
  style: compressed

# Exclude files
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
