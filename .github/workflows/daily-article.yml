name: Daily Article Generator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Pythonのバージョンを3.11に変更（警告対策）
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # 新しいライブラリ google-genai をインストール
      - name: Install Libraries
        run: pip install google-genai

      - name: Generate Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_column.py

      - name: Commit & Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add column/*.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add daily article" && git push)