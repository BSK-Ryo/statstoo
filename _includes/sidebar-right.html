<!-- Right Sidebar (Desktop Only) -->
<aside class="sidebar sidebar-right">
    <div class="sidebar-inner">
        <!-- Ad Space -->
        <div class="sidebar-ad">
            <div class="sidebar-ad-label">広告</div>
            <!-- AdSense広告: サイドバー右 300×250 -->
            <div class="sidebar-ad-placeholder">
                広告枠
            </div>
            <!-- 審査通過後、上のdiv.sidebar-ad-placeholderを削除し、下のinsタグのstyleをdisplay:inline-blockに変更してください -->
            <ins class="adsbygoogle"
                style="display:none;width:300px;height:250px"
                data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                data-ad-slot="XXXXXXXXXX"></ins>
        </div>
        
        <!-- Guide Links -->
        <div class="sidebar-section">
            <div class="sidebar-section-header"><span>📖</span> ガイド</div>
            <div class="sidebar-links">
                <a href="/help/" class="sidebar-link{% if page.url == '/help/' %} active{% endif %}">
                    <span class="sidebar-link-icon">❓</span>
                    <div class="sidebar-link-content">
                        <div class="sidebar-link-title">使い方ヘルプ</div>
                        <div class="sidebar-link-desc">ツールの使い方を説明</div>
                    </div>
                </a>
                <a href="/rule/" class="sidebar-link{% if page.url contains '/rule/' %} active{% endif %}">
                    <span class="sidebar-link-icon">📋</span>
                    <div class="sidebar-link-content">
                        <div class="sidebar-link-title">バスケの基本ルール</div>
                        <div class="sidebar-link-desc">バスケのルールとポジションを初心者向けに解説</div>
                    </div>
                </a>
            </div>
        </div>
        
        <!-- skill Links -->
        <div class="sidebar-section">
            <div class="sidebar-section-header"><span>💡</span> スキル</div>
            <div class="sidebar-links">
                <a href="/skill/dribble" class="sidebar-link{% if page.url == '/skill/dribble' %} active{% endif %}">
                    <span class="sidebar-link-icon">💡</span>
                    <div class="sidebar-link-content">
                        <div class="sidebar-link-title">ドリブルスキル</div>
                        <div class="sidebar-link-desc">ドリブルに関する知識やトレンドを紹介</div>
                    </div>
                </a>
            </div>
        </div>
        
        <!-- Support Links -->
        <div class="sidebar-section">
            <div class="sidebar-section-header"><span>💬</span> サポート</div>
            <div class="sidebar-links">
                <a href="/contact/" class="sidebar-link{% if page.url == '/contact/' %} active{% endif %}">
                    <span class="sidebar-link-icon">📧</span>
                    <div class="sidebar-link-content">
                        <div class="sidebar-link-title">お問い合わせ</div>
                        <div class="sidebar-link-desc">ご質問・ご要望はこちら</div>
                    </div>
                </a>
                <a href="/about/" class="sidebar-link{% if page.url == '/about/' %} active{% endif %}">
                    <span class="sidebar-link-icon">👤</span>
                    <div class="sidebar-link-content">
                        <div class="sidebar-link-title">運営者情報</div>
                        <div class="sidebar-link-desc">StatsTooについて</div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</aside>
