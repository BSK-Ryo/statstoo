<!-- Left Sidebar (Desktop Only) -->
<aside class="sidebar sidebar-left">
    <div class="sidebar-inner">
        <!-- Ad Space -->
        <div class="sidebar-ad">
            <div class="sidebar-ad-label">広告</div>
            <!-- AdSense広告: サイドバー左 300×250 -->
            <div class="sidebar-ad-placeholder">
                広告枠
            </div>
            <!-- 審査通過後、上のdiv.sidebar-ad-placeholderを削除し、下のinsタグのstyleをdisplay:inline-blockに変更してください -->
            <ins class="adsbygoogle"
                style="display:none;width:300px;height:250px"
                data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                data-ad-slot="XXXXXXXXXX"></ins>
        </div>
        
        <!-- Tools Links -->
        <div class="sidebar-section">
            <div class="sidebar-section-header"><span>🛠️</span> ツール一覧</div>
            <div class="sidebar-links">
                <a href="/" class="sidebar-link{% if page.url == '/' %} active{% endif %}">
                    <span class="sidebar-link-icon">📊</span>
                    <div class="sidebar-link-content">
                        <div class="sidebar-link-title">試合スタッツ記録</div>
                        <div class="sidebar-link-desc">試合中の選手全員のスタッツを記録</div>
                    </div>
                </a>
                <a href="/tools/mulch-game-stats/" class="sidebar-link{% if page.url contains 'multi-game-stats' %} active{% endif %}">
                    <span class="sidebar-link-icon">🏀</span>
                    <div class="sidebar-link-content">
                        <div class="sidebar-link-title">マルチゲームスタッツ</div>
                        <div class="sidebar-link-desc">レクリエーションなどにおすすめ！</div>
                    </div>
                </a>
                <a href="/tools/3point-shot-chart/" class="sidebar-link{% if page.url contains '3point-shot-chart' %} active{% endif %}">
                    <span class="sidebar-link-icon">🎯</span>
                    <div class="sidebar-link-content">
                        <div class="sidebar-link-title">3Pシュートチャート</div>
                        <div class="sidebar-link-desc">5つスポット別成功率を記録</div>
                    </div>
                </a>
                <a href="/tools/2point-shot-chart/" class="sidebar-link{% if page.url contains '2point-shot-chart' %} active{% endif %}">
                    <span class="sidebar-link-icon">🎯</span>
                    <div class="sidebar-link-content">
                        <div class="sidebar-link-title">2Pシュートチャート</div>
                        <div class="sidebar-link-desc">11箇所のエリア別成功率を記録</div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</aside>
