<style>
    /* ドロップダウンメニューのアニメーション */

        opacity: 1;
        transform: translateY(0);
    }
    
    /* デスクトップ版：ホバーでも開く */

        #tools-dropdown-desktop:hover #tools-menu-desktop,
        #rule-dropdown-desktop:hover #rule-menu-desktop {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<script>
    // 汎用ドロップダウンの開閉
    function toggleDropdown(name, type) {
        const menu = document.getElementById(name + '-menu-' + type);
        const arrow = document.getElementById(name + '-dropdown-arrow-' + type);
        
        if (type === 'desktop') {
            menu.classList.toggle('show');
            arrow.classList.toggle('rotate-180');
        } else {
            // モバイル版
            menu.classList.toggle('hidden');
            arrow.classList.toggle('rotate-180');
        }
    }
    
    // デスクトップ版：外側クリックで閉じる
    document.addEventListener('click', function(event) {
        const dropdowns = ['tools', 'rule'];
        
        dropdowns.forEach(function(name) {
            const dropdown = document.getElementById(name + '-dropdown-desktop');
            const menu = document.getElementById(name + '-menu-desktop');
            const arrow = document.getElementById(name + '-dropdown-arrow-desktop');
            
            if (dropdown && menu && !dropdown.contains(event.target)) {
                menu.classList.remove('show');
                if (arrow) arrow.classList.remove('rotate-180');
            }
        });
    });
    
    // モバイルメニューの開閉
    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        const iconOpen = document.getElementById('menu-icon-open');
        const iconClose = document.getElementById('menu-icon-close');
        
        menu.classList.toggle('hidden');
        iconOpen.classList.toggle('hidden');
        iconClose.classList.toggle('hidden');
    }
</script>
