<style>
    /* ドロップダウンメニューのアニメーション */
    #tools-menu-desktop.show {
        display: block;
        opacity: 1;
        transform: translateY(0);
    }
    
    /* デスクトップ版：ホバーでも開く */
    @media (min-width: 768px) {
        #tools-dropdown-desktop:hover #tools-menu-desktop {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<script>
    // ツール一覧ドロップダウンの開閉
    function toggleToolsDropdown(type) {
        const menu = document.getElementById('tools-menu-' + type);
        const arrow = document.getElementById('dropdown-arrow-' + type);
        
        if (type === 'desktop') {
            menu.classList.toggle('show');
            arrow.classList.toggle('rotate-180');
        } else {
            // モバイル版
            menu.classList.toggle('hidden');
            arrow.classList.toggle('rotate-180');
        }
    }
    
    // デスクトップ版：外側クリックで閉じる
    document.addEventListener('click', function(event) {
        const desktopDropdown = document.getElementById('tools-dropdown-desktop');
        const desktopMenu = document.getElementById('tools-menu-desktop');
        
        if (desktopDropdown && desktopMenu && !desktopDropdown.contains(event.target)) {
            desktopMenu.classList.remove('show');
            document.getElementById('dropdown-arrow-desktop').classList.remove('rotate-180');
        }
    });
    
    // モバイルメニューの開閉
    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        const iconOpen = document.getElementById('menu-icon-open');
        const iconClose = document.getElementById('menu-icon-close');
        
        menu.classList.toggle('hidden');
        iconOpen.classList.toggle('hidden');
        iconClose.classList.toggle('hidden');
    }
</script>
