<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% seo %}

<!-- Organization structured data (homepage only) -->
{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "StatsToo（スタッツー）",
  "url": "https://statstoo.com",
  "logo": "https://statstoo.com/image/favicon.png",
  "description": "{{ site.description }}",
  "sameAs": [
    "https://www.instagram.com/statstoo_2026/"
  ],
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer service",
    "url": "https://statstoo.com/contact/"
  }
}
</script>
{% endif %}

<!-- SoftwareApplication structured data (tool pages only) -->
{% if page.is_tool %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "{{ page.tool_name }}",
  "applicationCategory": "SportsApplication",
  "operatingSystem": "Web",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "JPY"
  },
  "description": "{{ page.description }}",
  "url": "{{ site.url }}{{ page.url }}"
}
</script>
{% endif %}

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="480x480" href="/image/favicon.png">
<link rel="apple-touch-icon" href="/image/favicon.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: {
                        DEFAULT: '#EA580C',
                        light: '#FB923C',
                        dark: '#C2410C',
                    },
                    secondary: {
                        DEFAULT: '#1e293b',
                        light: '#334155',
                    }
                },
                fontFamily: {
                    'display': ['Bebas Neue', 'sans-serif'],
                    'body': ['Noto Sans JP', 'sans-serif'],
                }
            }
        }
    }
</script>

<style>
    body {
        font-family: 'Noto Sans JP', sans-serif;
        background-color: #faf8f5;
        color: #1e293b;
    }

    .font-display {
        font-family: 'Bebas Neue', sans-serif;
    }

    /* Logo bounce animation */
    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
    }
    .logo-bounce {
        animation: bounce 2s ease-in-out infinite;
    }

    /* Page Header Background Pattern */
    .page-header-pattern::before {
        content: '';
        position: absolute;
        inset: 0;
        background: 
            repeating-linear-gradient(
                90deg,
                transparent,
                transparent 80px,
                rgba(255,255,255,0.02) 80px,
                rgba(255,255,255,0.02) 82px
            );
    }
</style>
